pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

//    def pluginsRoot = file('C:/Users/cd03059/AppData/Local/Pub/Cache/hosted/pub.dev')
    def pluginsRoot = new File(flutterSdkPath).getParentFile().getParentFile()  // Up 2 levels from Flutter SDK
    pluginsRoot = new File(pluginsRoot, "Pub/Cache/hosted/pub.dev")

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
// Set consistent paths for plugins
    include ':flutter_plugin_android_lifecycle'
    project(':flutter_plugin_android_lifecycle').projectDir = new File(pluginsRoot, 'flutter_plugin_android_lifecycle-2.0.24/android')

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    id("com.google.gms.google-services") version "4.4.4" apply false
}

include ":app"