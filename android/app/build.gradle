plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version")
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // If you decide to re-enable R8 later for release, uncomment these:
    // implementation 'jcifs:jcifs:1.3.19'
    // implementation 'javax.security:auth:1.0'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.mtech.attendance"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.mtech.attendance"
        minSdk = 26
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        create("release") {
            keyAlias = "upload"/*keystoreProperties["keyAlias"] as String*/
            keyPassword =  "Admin@12345\$"/*keystoreProperties["keyPassword"] as String*/
            storeFile = file("upload-keystore.jks")
            storePassword = "Admin@12345\$"/*keystoreProperties["storePassword"] as String*/
        }
    }

    buildTypes {
        release {
            // 👇 DISABLE obfuscation and resource shrinking
            minifyEnabled false
            shrinkResources false

            // Optional: keep debug signing for now, use release signing config in production
//            signingConfig signingConfigs.debug
            signingConfig = signingConfigs.getByName("release")
        }
    }
}

flutter {
    source = "../.."
}